name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 * * 1'
    - cron: '0 0 * * 4'
  workflow_dispatch:
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP Status: $RESPONSE"
          [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ] && echo "Supabase aktif" || exit 1
      - name: Query kupon_qurban
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/kupon_qurban?limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
